# Runs the JVM unit tests with line coverage (JaCoCo through the Android Gradle plugin) on GitHub Actions and prints which files have the most lines no test runs.
# The total is compared with the floor in tools/coverage_floor.json (the measured value, rounded down); the run fails below it.
# Nothing is built for release, nothing is signed and no version changes (HYDRA_UMC_CI=1).
name: Android coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Unit tests with line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the unit tests with coverage
        env:
          HYDRA_UMC_CI: "1"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon -PhydraUmcCoverage=true testDebugUnitTest createDebugUnitTestCoverageReport

      - name: Say which files have the most lines no test runs
        shell: bash
        run: |
          set -o pipefail
          python tools/kotlin_coverage.py --top 25 --floor-file tools/coverage_floor.json | tee "$GITHUB_STEP_SUMMARY"
