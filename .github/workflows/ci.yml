name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the HYDRA-UMC-SDK contracts for the route check
        run: |
          mkdir -p "$RUNNER_TEMP/hydra-umc-sdk"
          curl -fsSL --retry 3 https://github.com/JuanenRac/HYDRA-UMC-SDK/archive/refs/tags/v0.6.4.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/hydra-umc-sdk"
          echo "HYDRA_UMC_SDK_DIR=$RUNNER_TEMP/hydra-umc-sdk" >> "$GITHUB_ENV"
          echo "HYDRA_UMC_REQUIRE_WORKSPACE=1" >> "$GITHUB_ENV"
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          android-tasks: "test lint"
      - name: Test the release publish script keeps the token off the command line
        if: ${{ hashFiles('tools/test_publish_script.py') != '' }}
        run: python tools/test_publish_script.py
