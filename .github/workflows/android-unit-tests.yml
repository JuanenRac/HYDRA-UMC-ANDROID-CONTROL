# Runs the JVM unit tests of the app (the view model and its helpers) on GitHub Actions, so they never have to be compiled on a developer's PC.
# Nothing is built for release, nothing is signed and no version changes (HYDRA_UMC_CI=1).
name: Android unit tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Run the unit tests
        env:
          HYDRA_UMC_CI: "1"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
