# =============================================================================
# HYDRA-UMC Android Control - build version state
# =============================================================================
# Auto-bumped by app/build.gradle.kts on every Gradle configuration (i.e.
# every real build - assemble/install/compile all evaluate this script) -
# do not edit these numbers by hand while a build may be running.
#
# Odometer rule (ecosystem-wide convention, base 10, same as
# HYDRA-UMC-STUDIO/scripts/bump-version.mjs, HYDRA-UMC-SUITE/bump_version.py
# and HYDRA-UMC-IOS-CONTROL/tool/bump_version.dart): patch +1 on every build;
# if patch would go above 9 it resets to 0 and minor +1 instead.
# Example: 0.0.9 -> 0.1.0.
#
# versionCode is a separate, simple monotonic counter (+1 always, no carry) -
# Android requires versionCode to strictly increase across all builds that
# ever ship, so it cannot follow the same reset-at-9 rule as versionName.
versionMajor=0
versionMinor=3
versionPatch=7
versionCode=38